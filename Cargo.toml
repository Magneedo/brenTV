[package]
name = "brentv-core"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
base64 = "0.22.1"
chrono = "0.4.45"
futures = "0.3.32"
log = "0.4.33"
libc = "0.2"
prost = "0.14"
prost-types = "0.14.4"
r2d2 = "0.8.10"
r2d2_sqlite = "0.36.0"
regex = "1.12.4"
rusqlite = { version = "0.41.0", features = ["bundled"] }
rusqlite_migration = "2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry", "env-filter"] }
tracing-log = "0.2"
sysdirs = "0.9.4"
tokio = { version = "1.52", features = ["full"] }
quick-xml = "0.41"
flate2 = "1"
getrandom = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "native-tls-vendored",
    "charset",
    "http2",
] }
tracing-android = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
tracing-oslog = "0.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "charset",
    "http2",
] }

[dev-dependencies]
tempfile = "3.27.0"

# Install cargo-cmd:
# cargo install cargo-cmd
[package.metadata.commands]
build-linux = "cargo build --release && mkdir -p flutter/linux/libs && cp target/release/libbrentv_core.so flutter/linux/libs/"
# install cbindgen, cargo install cbindgen
gen-header = "cbindgen --config ./template.toml --crate brentv-core --output out/lib.h"
# install protobuf, on windows: scoop install protobuf. AND cargo install protoc-gen-prost
gen-proto-rust = "protoc --prost_opt=flat_output_dir=true --prost_out=src -I ./protocol/ generated_proto.proto"
# needed: dart pub global activate protoc_plugin
gen-proto-dart = "protoc --dart_out=flutter/lib/generated -I ./protocol/ generated_proto.proto"
ffigen = "cd flutter && dart run ffigen"
